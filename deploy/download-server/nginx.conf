# Independent process; never included by the system nginx configuration.
worker_processes 1;
pid /run/stackpilot-download/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/stackpilot-download/access.log;
  client_body_temp_path /run/stackpilot-download/client;
  proxy_temp_path /run/stackpilot-download/proxy;
  fastcgi_temp_path /run/stackpilot-download/fastcgi;
  uwsgi_temp_path /run/stackpilot-download/uwsgi;
  scgi_temp_path /run/stackpilot-download/scgi;
  sendfile on;
  server_tokens off;
  keepalive_timeout 15;
  limit_conn_zone $binary_remote_addr zone=download_ip:1m;
  limit_conn_zone $server_name zone=download_total:1m;
  server {
    listen 18080;
    server_name _;
    root /srv/stackpilot-download;
    index index.html;
    autoindex off;
    limit_conn download_ip 2;
    limit_conn download_total 8;
    limit_rate 2m;
    location / { try_files $uri $uri/ =404; limit_except GET { deny all; } }
    location ~ /\. { deny all; }
    location ~* \.exe$ {
      try_files $uri =404;
      add_header Content-Disposition 'attachment';
      limit_except GET { deny all; }
    }
  }
}
